version = 1
SPDX-PackageName = "rnl-gallery"
SPDX-PackageDownloadLocation = "https://github.com/rich-netlist/rnl-gallery"

# The code of the checks, and the workflows.
[[annotations]]
path = ["tools/*.mjs", "tools/lib/**", "tools/package.json", "tools/package-lock.json", ".github/workflows/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 many-question"
SPDX-License-Identifier = "MIT"

# The entries, the schema, the documents, and what the tests of the checks read.
[[annotations]]
path = ["README.md", "CONTRIBUTING.md", "REUSE.toml", ".gitignore", ".gitattributes", ".github/PULL_REQUEST_TEMPLATE.md", "schema/**", "entries/**", "tools/test/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 many-question"
SPDX-License-Identifier = "CC0-1.0"

# Each example is under the licence of its own directory, which also holds the text (LICENSE) and is named by
# `license` in its entry; the checks compare the two. What a language model wrote has no copyright holder.
[[annotations]]
path = ["examples/pll/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["examples/risca/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 many-question"
SPDX-License-Identifier = "CC-BY-4.0"

# The twelve examples of the RNL 0.4 solver: the netlists and what is asked of their drawings are many-question's;
# the schematics were generated by the RNL solver.
[[annotations]]
path = ["examples/cs-amplifier/**", "examples/ota5t/**", "examples/r2r-dac4/**", "examples/fd-sample-hold/**", "examples/miller-opamp/**", "examples/bandgap-reference/**", "examples/tow-thomas-biquad/**", "examples/diff-pair-resistive/**", "examples/ctle-rc-degenerated/**", "examples/preamp-latch-comparator/**", "examples/telescopic-ota/**", "examples/lc-ladder-lowpass/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 many-question"
SPDX-License-Identifier = "CC0-1.0"
