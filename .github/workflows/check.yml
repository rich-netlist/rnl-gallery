name: Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The target must be main
        run: |
          if [ "${{ github.base_ref }}" != main ]; then
            echo "::error::Pull requests go to main, not to ${{ github.base_ref }}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
      - name: Tests of the tools
        run: node --test tools/test.mjs
      # Entries are checked against their sources: the files at the commit, the repository's licence,
      # `rnl check` through the core as WebAssembly, and the thumbnail. A change to the tools checks all of them.
      - name: Check the entries this change touches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ids=$(node tools/changed.mjs "origin/${{ github.base_ref }}")
          echo "changed: $ids"
          case "$ids" in
            none) mkdir -p dist ;;
            all) node tools/build.mjs --out dist ;;
            *) node tools/build.mjs --out dist --only "$ids" ;;
          esac
      - name: Keep the thumbnails and manifests for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-preview
          path: dist
          if-no-files-found: error
